name: Update Live Scores

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get live matches
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          curl -s \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?live=all" \
            > live.json

      - name: Save data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add live.json
          git diff --cached --quiet || git commit -m "Update live scores"
          git push
