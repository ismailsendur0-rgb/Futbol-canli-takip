```yaml
name: Update Upcoming Matches

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get upcoming matches
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e

          TODAY=$(date -u +%Y-%m-%d)
          TOMORROW=$(date -u -d "tomorrow" +%Y-%m-%d)

          if [ -z "$API_KEY" ]; then
            echo "API_FOOTBALL_KEY secret bulunamadı."
            exit 1
          fi

          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            > today.json

          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TOMORROW" \
            > tomorrow.json

          jq -s '
            {
              get: "fixtures",
              parameters: {
                dates: [.[0].parameters.date, .[1].parameters.date]
              },
              errors: {},
              results: ((.[0].response // []) + (.[1].response // []) | length),
              paging: {
                current: 1,
                total: 1
              },
              response: ((.[0].response // []) + (.[1].response // []))
            }
          ' today.json tomorrow.json > upcoming.json

      - name: Save data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add upcoming.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Update upcoming matches"
            git push
          fi
```
